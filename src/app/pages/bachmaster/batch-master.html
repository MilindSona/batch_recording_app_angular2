<div class="container-fluid py-5 main-container">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card form-card">
                <div class="card-body p-4">
                    <div class="section-header">
                        <i class="fas"></i>
                        <h4>
                            <i class="fas" [ngClass]="isEditMode ? 'fa-edit' : 'fa-plus-circle'"></i>
                            {{ isEditMode ? 'Update Batch' : 'Add New Batch' }}
                        </h4>

                    </div>

                    <form>
                        <div class="mb-3">
                            <label for="batchName" class="form-label">
                                <i class="fas fa-tag me-2"></i>Batch Name
                            </label>
                            <input type="text" [(ngModel)]="newBatchObj.batchName" name="batchName" class="form-control"
                                id="batchName" placeholder="Enter batch name">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                <i class="fas fa-align-left me-2"></i>Description
                            </label>
                            <textarea [(ngModel)]="newBatchObj.description" name="description" class="form-control"
                                id="description" rows="3" placeholder="Enter batch description"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startDate" class="form-label">
                                    <i class="fas fa-calendar-plus me-2"></i>Start Date
                                </label>
                                <input type="datetime-local" [(ngModel)]="newBatchObj.startDate" name="startDate"
                                    class="form-control" id="startDate">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="endDate" class="form-label">
                                    <i class="fas fa-calendar-check me-2"></i>End Date
                                </label>
                                <input type="datetime-local" [(ngModel)]="newBatchObj.endDate" name="endDate"
                                    class="form-control" id="endDate">
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input [(ngModel)]="newBatchObj.isActive" class="form-check-input" name="isActive"
                                    type="checkbox" id="isActive" checked>
                                <label class="form-check-label fw-semibold" for="isActive">
                                    <i class="fas fa-toggle-on me-2"></i>Active Status
                                </label>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" (click)="onSaveBatch()" class="btn btn-custom"
                                [ngClass]="isEditMode ? 'btn-warning-custom' : 'btn-success-custom'">
                                <i class="fas" [ngClass]="isEditMode ? 'fa-edit' : 'fa-save'"></i>
                                {{ isEditMode ? 'Update Batch' : 'Create Batch' }}
                            </button>


                            <button (click)="onResetForm()" type="button" class="btn btn-custom btn-secondary-custom">
                                <i class="fas fa-redo me-2"></i>
                                {{ isEditMode ? 'Cancel Edit' : 'Reset Form' }}
                            </button>

                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <p-toast position="top-center"></p-toast>
            <div class="card table-card">
                <p-confirmDialog></p-confirmDialog>
                <div class="card-body p-4">
                    <div class="section-header">
                        <i class="fas fa-list"></i>
                        <h4>Batch List</h4>
                    </div>

                    <div class="table-responsive">
                        <p-contextMenu #cm [model]="contextItems" [appendTo]="'body'" [autoZIndex]="true"
                            [baseZIndex]="1100"></p-contextMenu>
                        <p-table [value]="batchList()" [tableStyle]="{'min-width':'40rem'}"
                            [responsiveLayout]="'scroll'" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5,10,20]"
                            [showFirstLastIcon]="true" [showCurrentPageReport]="true"
                            currentPageReportTemplate="Showing {first}–{last} of {totalRecords}" [contextMenu]="cm"
                            [contextMenuSelection]="selectedBatch" (onContextMenuSelect)="onContextMenuSelect($event)">
                            <ng-template pTemplate="colgroup">
                                <colgroup>
                                    <col style="width:3rem">
                                    <col style="width:30%">
                                    <col style="width:18%">
                                    <col style="width:18%">
                                    <col style="width:20%">
                                </colgroup>
                            </ng-template>
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Start Date</th>
                                    <th>End Date</th>
                                    <th>Status</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
                                <tr [pContextMenuRow]="item">
                                    <td><strong>{{rowIndex + 1}}</strong></td>
                                    <td>{{item.batchName}}</td>
                                    <td>{{item.startDate | date:'dd-MM-yy'}}</td>
                                    <td>{{item.endDate | date:'dd-MM-yy'}}</td>
                                    <td>
                                        <span class="badge-status"
                                            [ngClass]="item.isActive ? 'badge-active' : 'badge-inactive'">
                                            <i class="fas fa-check-circle me-1"></i>{{item.isActive ? 'Active' :
                                            'In-active'}}
                                        </span>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
